[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-shrimp"
dynamic = ["version"]
description = "Telegram bot for remote Claude access via the Agent SDK"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # Only the SDK's win_amd64 wheel carries claude.exe; the sdist pip
    # falls back to is empty.  Not every release publishes that wheel —
    # 0.2.144 does not — so check the target has one before bumping.
    "claude-agent-sdk==0.2.143",
    "python-telegram-bot[httpx,job-queue]",
    "aiosqlite",
    "pyyaml",
    "mistune>=3.0,<4.0",
    "starlette",
    "uvicorn[standard]",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-bash>=0.23,<1.0",
    "platformdirs>=4.0",
    "watchfiles>=1.0",
    "ruamel.yaml>=0.18",
    "json5>=0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
libvirt = ["libvirt-python>=10.0"]
lark = ["lark-oapi"]
# Windows-only: the HCS sandbox backend drives computecore/computenetwork/
# virtdisk through win32more's ctypes bindings.  Pinned exactly — treat any
# bump as a re-validation (the bindings are generated from preview metadata).
# zstandard unpacks the released guest rootfs images, which travel compressed
# because a release rejects any asset of 2 GiB or more.
hcs = ["win32more==0.8.1", "zstandard>=0.23"]

[project.scripts]
openshrimp = "open_shrimp.main:main"

[tool.hatch.build.targets.sdist.force-include]
"Dockerfile.claude" = "Dockerfile.claude"
"seccomp-dind.json" = "seccomp-dind.json"
"web/config-app/dist" = "web/config-app/dist"
"web/markdown-app/dist" = "web/markdown-app/dist"
"web/pdf-app/dist" = "web/pdf-app/dist"
"web/review-app/dist" = "web/review-app/dist"
"web/terminal-app/dist" = "web/terminal-app/dist"
"web/vnc-app/dist" = "web/vnc-app/dist"

[tool.hatch.build.targets.wheel.force-include]
"Dockerfile.claude" = "open_shrimp/Dockerfile.claude"
"seccomp-dind.json" = "open_shrimp/seccomp-dind.json"
"web/config-app/dist" = "open_shrimp/config_app/static"
"web/markdown-app/dist" = "open_shrimp/preview/static"
"web/pdf-app/dist" = "open_shrimp/preview/static-pdf"
"web/review-app/dist" = "open_shrimp/review/static"
"web/terminal-app/dist" = "open_shrimp/terminal/static"
"web/vnc-app/dist" = "open_shrimp/vnc/static"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx",
    # Also in the `hcs` extra; here so the guest-image unpack is exercised on
    # a developer machine that is not the Windows host.
    "zstandard>=0.23",
]
